# The PR gate. The AI PR agent (.github/workflows/ai-pr-agent.yml) refuses to merge a
# pull request without a green check, so this is the check it waits for.
#
# Deliberately not docker-publish.yml: that one talks to SonarCloud and pushes an image,
# neither of which belongs on a dependency bump. Build + tests only.
name: PR Check

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Check formatting
        run: mvn -B fmt:check

      - name: Build, test, coverage
        run: mvn -B verify